<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="본사 주차장 참고용 도면">
  <rect width="900" height="520" fill="#f8fafc"/>
  <rect x="20" y="20" width="860" height="480" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="40" y="56" font-family="sans-serif" font-size="20" font-weight="700" fill="#0f172a">본사 주차장 (참고용 도면)</text>
  <text x="40" y="80" font-family="sans-serif" font-size="13" fill="#64748b">실제 배정은 주차면 코드(A-01 ~ A-17, D-01 ~ D-03) 기준으로 처리됩니다.</text>

  <!-- 일반 주차면 A-01 ~ A-09 (상단) -->
  <g font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <g fill="#e2e8f0" stroke="#94a3b8">
      <rect x="50" y="110" width="80" height="90" rx="4"/>
      <rect x="140" y="110" width="80" height="90" rx="4"/>
      <rect x="230" y="110" width="80" height="90" rx="4"/>
      <rect x="320" y="110" width="80" height="90" rx="4"/>
      <rect x="410" y="110" width="80" height="90" rx="4"/>
      <rect x="500" y="110" width="80" height="90" rx="4"/>
      <rect x="590" y="110" width="80" height="90" rx="4"/>
      <rect x="680" y="110" width="80" height="90" rx="4"/>
      <rect x="770" y="110" width="80" height="90" rx="4"/>
    </g>
    <g fill="#0f172a">
      <text x="90" y="160">A-01</text>
      <text x="180" y="160">A-02</text>
      <text x="270" y="160">A-03</text>
      <text x="360" y="160">A-04</text>
      <text x="450" y="160">A-05</text>
      <text x="540" y="160">A-06</text>
      <text x="630" y="160">A-07</text>
      <text x="720" y="160">A-08</text>
      <text x="810" y="160">A-09</text>
    </g>
  </g>

  <!-- 통행로 -->
  <rect x="50" y="215" width="800" height="60" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="8 6"/>
  <text x="450" y="252" font-family="sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">차량 통행로</text>

  <!-- 일반 주차면 A-10 ~ A-17 (하단) -->
  <g font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <g fill="#e2e8f0" stroke="#94a3b8">
      <rect x="50" y="290" width="80" height="90" rx="4"/>
      <rect x="140" y="290" width="80" height="90" rx="4"/>
      <rect x="230" y="290" width="80" height="90" rx="4"/>
      <rect x="320" y="290" width="80" height="90" rx="4"/>
      <rect x="410" y="290" width="80" height="90" rx="4"/>
      <rect x="500" y="290" width="80" height="90" rx="4"/>
      <rect x="590" y="290" width="80" height="90" rx="4"/>
      <rect x="680" y="290" width="80" height="90" rx="4"/>
    </g>
    <g fill="#0f172a">
      <text x="90" y="340">A-10</text>
      <text x="180" y="340">A-11</text>
      <text x="270" y="340">A-12</text>
      <text x="360" y="340">A-13</text>
      <text x="450" y="340">A-14</text>
      <text x="540" y="340">A-15</text>
      <text x="630" y="340">A-16</text>
      <text x="720" y="340">A-17</text>
    </g>
  </g>

  <!-- 이중주차 D-01 ~ D-03 -->
  <g font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <g fill="#ffedd5" stroke="#fb923c" stroke-dasharray="6 4">
      <rect x="50" y="400" width="130" height="70" rx="4"/>
      <rect x="190" y="400" width="130" height="70" rx="4"/>
      <rect x="330" y="400" width="130" height="70" rx="4"/>
    </g>
    <g fill="#9a3412">
      <text x="115" y="432">D-01</text>
      <text x="255" y="432">D-02</text>
      <text x="395" y="432">D-03</text>
      <text x="115" y="452" font-size="11" font-weight="400">이중주차</text>
      <text x="255" y="452" font-size="11" font-weight="400">이중주차</text>
      <text x="395" y="452" font-size="11" font-weight="400">이중주차</text>
    </g>
  </g>

  <!-- 출입구 -->
  <rect x="770" y="400" width="80" height="70" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="810" y="441" font-family="sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">출입구</text>
</svg>
